<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustOS Platform</title>
    <link rel="stylesheet" href="/portal.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="name">TrustOS</span>
        <span class="env" id="env" hidden></span>
      </div>
      <div class="who">
        <span id="user"></span>
        <button id="signout" type="button" hidden>Sign out</button>
      </div>
    </header>

    <main id="main">
      <section id="loading" class="panel">
        <p class="muted">Loading…</p>
      </section>

      <section id="signin" class="panel" hidden>
        <h1>TrustOS Platform</h1>
        <p class="lede">
          The governance surface for applications built on this framework. Sign in to see what is
          registered.
        </p>
        <button id="signin-button" type="button" class="primary">Sign in</button>
        <p class="muted small" id="signin-note"></p>
      </section>

      <section id="catalog" class="panel" hidden>
        <h1>Applications</h1>
        <p class="lede" id="catalog-lede"></p>
        <div id="apps" class="cards"></div>
      </section>

      <section id="console" class="panel" hidden>
        <button id="back" type="button" class="link">← All applications</button>
        <h1 id="console-name"></h1>
        <p class="lede" id="console-purpose"></p>
        <div id="console-meta" class="meta"></div>
        <div id="console-pages"></div>
      </section>

      <section id="error" class="panel" hidden>
        <h1>Something is refusing</h1>
        <p id="error-message" class="lede"></p>
        <pre id="error-detail" class="detail"></pre>
      </section>
    </main>

    <footer class="foot">
      <span id="foot-note"></span>
    </footer>

    <script src="/portal.js" type="module"></script>
  </body>
</html>
