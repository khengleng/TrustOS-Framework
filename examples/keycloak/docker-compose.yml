# Keycloak for local development. Not a production deployment.
#
# Two properties this file is built around:
#
#   * No credential is committed. Every secret is read from the environment, and
#     `.env` is gitignored. `docker compose up` fails loudly with an unset variable
#     rather than silently starting with a default password — a default admin
#     password on a development Keycloak is how a machine on a shared network
#     becomes a token issuer for somebody else.
#   * The realm is imported from a file, so the development environment is
#     reproducible and reviewable in a diff instead of being clicked together.
#
# TrustOS does not deploy Keycloak. This is an example you run yourself.

services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      # No default. Unset means the stack does not start.
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # `start-dev` disables HTTPS enforcement and clustering. Correct for a laptop,
    # never correct anywhere else — a production deployment uses `start` with TLS
    # terminated at the edge and KC_HOSTNAME set to the public domain.
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      # Read-only: the container must not be able to rewrite the realm definition
      # that the repository treats as the source of truth.
      - ./realm-trustos-dev.json:/opt/keycloak/data/import/realm-trustos-dev.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak-db-data:
